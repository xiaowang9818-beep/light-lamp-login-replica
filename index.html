<!doctype html>
<html lang="zh-CN" data-theme="warm" data-on="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>欢迎回来 · 拉灯登录</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="lamp-stage" aria-label="会跟随鼠标的小灯">
      <svg class="suspension" viewBox="0 0 330 390" aria-hidden="true">
        <!-- Cord elements retained from the original project's SVG. -->
        <line x1="24" y1="24" x2="310" y2="24" stroke="currentColor" stroke-width="1" opacity=".3"/>
        <line x1="166" y1="24" x2="166" y2="83" stroke="currentColor" stroke-width="4"/>
        <rect x="158" y="20" width="16" height="8" fill="#111827" stroke="currentColor" stroke-width="2"/>
      </svg>
      <img class="light-beam" src="assets/light-beam.png" alt="" draggable="false">
      <svg class="cord-svg" viewBox="0 0 330 390" aria-hidden="true">
        <path class="cord" d="M207 178 Q207 228 207 288" fill="none" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <div class="shade-motion">
        <img class="shade" src="assets/lamp-shade.png" alt="" draggable="false">
        <div class="face" aria-hidden="true">
          <div class="eye"><img class="eyeball" src="assets/eye-white.svg" alt=""><img class="pupil" src="assets/eye-pupil.svg" alt=""><img class="eyebrow" src="assets/minus.svg" alt=""></div>
          <div class="eye"><img class="eyeball" src="assets/eye-white.svg" alt=""><img class="pupil" src="assets/eye-pupil.svg" alt=""><img class="eyebrow" src="assets/minus.svg" alt=""></div>
          <img class="mouth" src="assets/mouth.svg" alt="">
        </div>
      </div>
      <button class="pull-handle" id="pull-handle" aria-label="拉动灯绳，关闭灯光" aria-pressed="true" title="向下拉动，或点击切换灯光">
        <img src="assets/eye-white.svg" alt="" draggable="false">
      </button>
      <p class="pull-hint">拉动灯绳</p>
    </div>
    <section class="login-card" aria-labelledby="welcome-title">
      <h1 id="welcome-title">欢迎回来</h1>
      <p class="subtitle">Welcome back</p>
      <form id="login-form" novalidate>
        <label for="username">账号</label>
        <input id="username" name="username" placeholder="请输入账号" autocomplete="username" required>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        <button class="login-button" type="submit">登 录</button>
        <button class="forgot-button" type="button">忘记密码?</button>
      </form>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
  <footer><span id="date"></span><span class="footer-dot">·</span><span>拉灯登录</span></footer>
  <script src="lamp.js"></script>
</body>
</html>
